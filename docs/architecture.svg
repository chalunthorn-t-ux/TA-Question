<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" font-family="Sarabun, 'TH Sarabun New', Tahoma, sans-serif">
  <style>
    .box   { fill:#ffffff; stroke:#334155; stroke-width:1.4; rx:8; }
    .zone  { fill:#f8fafc; stroke:#94a3b8; stroke-width:1.2; stroke-dasharray:6 4; rx:10; }
    .ext   { fill:#f1f5f9; stroke:#475569; stroke-width:1.4; rx:8; }
    .store { fill:#ffffff; stroke:#334155; stroke-width:1.4; }
    .t     { font-size:13px; fill:#0f172a; }
    .tb    { font-size:13.5px; fill:#0f172a; font-weight:700; }
    .ts    { font-size:11px; fill:#475569; }
    .zt    { font-size:11.5px; fill:#64748b; font-weight:700; letter-spacing:.5px; }
    .arrow { stroke:#334155; stroke-width:1.4; fill:none; marker-end:url(#a); }
    .label { font-size:10.5px; fill:#475569; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <text x="450" y="26" class="tb" font-size="16" text-anchor="middle">ภาพรวมสถาปัตยกรรมระบบผู้ช่วยตอบคำถามสำหรับ TA</text>

  <!-- ── ผู้ใช้ ── -->
  <rect x="30" y="70" width="160" height="62" class="box"/>
  <text x="110" y="94" class="tb" text-anchor="middle">ผู้ใช้งาน</text>
  <text x="110" y="114" class="ts" text-anchor="middle">TA · ผู้ดูแลระบบ</text>

  <rect x="30" y="160" width="160" height="62" class="box"/>
  <text x="110" y="184" class="tb" text-anchor="middle">เว็บเบราว์เซอร์</text>
  <text x="110" y="204" class="ts" text-anchor="middle">HTML · CSS · JavaScript</text>

  <path d="M110,132 L110,158" class="arrow"/>

  <!-- ── โซนเซิร์ฟเวอร์ ── -->
  <rect x="235" y="58" width="360" height="300" class="zone"/>
  <text x="250" y="78" class="zt">VERCEL (SERVERLESS FUNCTION)</text>

  <rect x="258" y="92" width="314" height="70" class="box"/>
  <text x="415" y="116" class="tb" text-anchor="middle">FastAPI Application</text>
  <text x="415" y="136" class="ts" text-anchor="middle">หน้าถาม-ตอบ · หน้าจัดการคลังความรู้ · จัดการสมาชิก</text>
  <text x="415" y="152" class="ts" text-anchor="middle">ตรวจสิทธิ์ผู้ใช้ · จำกัดจำนวนคำถามต่อ IP</text>

  <rect x="258" y="182" width="314" height="60" class="box"/>
  <text x="415" y="206" class="tb" text-anchor="middle">RAG Pipeline</text>
  <text x="415" y="226" class="ts" text-anchor="middle">อ่านเอกสาร → ลบชื่อบุคคล → ตัด chunk → สร้างเวกเตอร์</text>

  <rect x="258" y="262" width="314" height="72" class="box"/>
  <text x="415" y="286" class="tb" text-anchor="middle">Vector Store (ในหน่วยความจำ)</text>
  <text x="415" y="306" class="ts" text-anchor="middle">ค้นแบบผสม: ความหมาย (cosine) + คำสำคัญ (TF-IDF)</text>
  <text x="415" y="322" class="ts" text-anchor="middle">โหลดจากที่เก็บถาวรตอนเซิร์ฟเวอร์เริ่มทำงาน</text>

  <path d="M190,191 L256,191" class="arrow"/>
  <text x="223" y="185" class="label" text-anchor="middle">HTTPS</text>
  <path d="M415,162 L415,180" class="arrow"/>
  <path d="M415,242 L415,260" class="arrow"/>

  <!-- ── บริการภายนอก ── -->
  <rect x="650" y="92" width="220" height="86" class="ext"/>
  <text x="760" y="118" class="tb" text-anchor="middle">Google Gemini API</text>
  <text x="760" y="140" class="ts" text-anchor="middle">gemini-embedding-001</text>
  <text x="760" y="158" class="ts" text-anchor="middle">(สร้างเวกเตอร์ 768 มิติ)</text>
  <text x="760" y="174" class="ts" text-anchor="middle">gemini-3.6-flash (สรุปคำตอบ)</text>

  <path d="M572,135 L648,135" class="arrow"/>
  <path d="M648,150 L572,212" class="arrow"/>

  <!-- ── ที่เก็บถาวร ── -->
  <rect x="235" y="392" width="640" height="150" class="zone"/>
  <text x="250" y="412" class="zt">ที่เก็บถาวร (เลือกอัตโนมัติตามค่าที่ตั้งไว้)</text>

  <path d="M258,448 h180 v76 a90,14 0 0 1 -180,0 v-76" class="store"/>
  <ellipse cx="348" cy="448" rx="90" ry="14" class="store"/>
  <text x="348" y="452" class="tb" text-anchor="middle">PostgreSQL (Neon)</text>
  <text x="348" y="484" class="ts" text-anchor="middle">บัญชีผู้ใช้ · ค่าตั้งระบบ</text>
  <text x="348" y="502" class="ts" text-anchor="middle">เอกสารต้นฉบับ · index</text>
  <text x="348" y="520" class="ts" text-anchor="middle">คำถามที่ตอบไม่ได้</text>

  <path d="M488,448 h180 v76 a90,14 0 0 1 -180,0 v-76" class="store"/>
  <ellipse cx="578" cy="448" rx="90" ry="14" class="store"/>
  <text x="578" y="452" class="tb" text-anchor="middle">Vercel Blob</text>
  <text x="578" y="484" class="ts" text-anchor="middle">ทางเลือกสำหรับไฟล์ใหญ่</text>
  <text x="578" y="502" class="ts" text-anchor="middle">เอกสารต้นฉบับ · index</text>
  <text x="578" y="520" class="ts" text-anchor="middle">(ใช้เมื่อตั้ง token ไว้)</text>

  <rect x="700" y="430" width="160" height="94" class="box"/>
  <text x="780" y="454" class="tb" text-anchor="middle">ดิสก์ในเครื่อง</text>
  <text x="780" y="476" class="ts" text-anchor="middle">data/ · storage/</text>
  <text x="780" y="496" class="ts" text-anchor="middle">ใช้ตอนพัฒนาในเครื่อง</text>
  <text x="780" y="514" class="ts" text-anchor="middle">(เซิร์ฟเวอร์เขียนดิสก์ไม่ได้)</text>

  <path d="M370,334 L360,430" class="arrow"/>
  <path d="M460,334 L565,430" class="arrow"/>

  <text x="450" y="566" class="ts" text-anchor="middle">
    หมายเหตุ: เซิร์ฟเวอร์แบบ serverless เขียนไฟล์ลงดิสก์ไม่ได้ ระบบจึงต้องมีที่เก็บถาวรอย่างน้อยหนึ่งอย่างเสมอ
  </text>
</svg>
